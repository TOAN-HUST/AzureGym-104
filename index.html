<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f6cbd" />
    <title>AzureGym</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f6cbd'/%3E%3Ctext x='16' y='22' font-size='14' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EAZ%3C/text%3E%3C/svg%3E"
    />
    <style>
      /* ====================
       Theme tokens
       ==================== */
      :root {
        --bg: #f4f6f8;
        --card: #ffffff;
        --text: #1b1f24;
        --muted: #5f6b7a;
        --border: #dde2e8;
        --primary: #0f6cbd;
        --primary-soft: #e6f0fa;
        --ok: #1a7f37;
        --ok-bg: #e7f5ea;
        --bad: #c62828;
        --bad-bg: #fdecec;
        --fav: #d79b00;
        --warn: #b26a00;
        --warn-bg: #fff4e0;
        --track: #e3e7ec;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111418;
          --card: #1b2027;
          --text: #e8ebef;
          --muted: #9aa5b1;
          --border: #2e3640;
          --primary: #4f9be8;
          --primary-soft: #1d2f44;
          --ok: #4cc26b;
          --ok-bg: #16301f;
          --bad: #f0706a;
          --bad-bg: #3a1c1c;
          --fav: #f2c14e;
          --warn: #f0b44c;
          --warn-bg: #3a2c12;
          --track: #2a313a;
        }
      }

      /* ====================
       Base
       ==================== */
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          17px/1.55 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          "Hiragino Sans",
          "Yu Gothic UI",
          Meiryo,
          "Noto Sans JP",
          sans-serif;
        overflow-wrap: anywhere;
      }
      [hidden] {
        display: none !important;
      }
      .app {
        max-width: 720px;
        margin: 0 auto;
        padding: 12px 16px calc(24px + env(safe-area-inset-bottom));
      }
      h1 {
        font-size: 1.45rem;
        margin: 0;
      }
      h2 {
        font-size: 1.05rem;
        margin: 0 0 12px;
      }
      h3 {
        font-size: 0.95rem;
        margin: 0 0 6px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--muted);
      }
      p {
        margin: 0 0 8px;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 0.88rem;
      }
      .pre {
        white-space: pre-line;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        margin: 12px 0;
      }

      /* ====================
       Buttons & inputs
       ==================== */
      .btn {
        appearance: none;
        -webkit-appearance: none;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-weight: 600;
        min-height: 48px;
        padding: 10px 16px;
        border-radius: 12px;
        cursor: pointer;
        touch-action: manipulation;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn-primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .btn-danger {
        background: var(--bad);
        border-color: var(--bad);
        color: #fff;
      }
      .btn-danger-outline {
        color: var(--bad);
        border-color: var(--bad);
      }
      .btn-block {
        display: block;
        width: 100%;
      }

      .btn-ok {
        background: var(--ok-bg);
        border: 2px solid var(--ok);
        color: var(--ok);
      }
      .btn-warn {
        background: var(--warn-bg);
        border: 2px solid var(--warn);
        color: var(--warn);
      }

      /* Hàng lựa chọn dạng checkbox / radio, đủ lớn để bấm bằng ngón tay */
      .option-list {
        display: grid;
        gap: 8px;
      }
      .option {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 52px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
        cursor: pointer;
        touch-action: manipulation;
      }
      .option.checked {
        border-color: var(--primary);
        background: var(--primary-soft);
      }
      .option-all {
        border-style: dashed;
      }
      .option input {
        flex: none;
        width: 22px;
        height: 22px;
        margin: 0;
        accent-color: var(--primary);
      }
      .option-main {
        flex: 1;
        min-width: 0;
      }
      .option-label {
        display: block;
        font-weight: 600;
      }
      .option-hint {
        display: block;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .option-count {
        flex: none;
        font-weight: 700;
        color: var(--muted);
      }
      .review-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .review-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        text-align: left;
      }
      .review-count {
        color: var(--muted);
      }
      .start-bar {
        position: sticky;
        bottom: 0;
        z-index: 5;
        padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
        background: var(--bg);
      }

      .switch-row {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 48px;
        margin-bottom: 12px;
        cursor: pointer;
      }
      .switch-row input {
        width: 22px;
        height: 22px;
        accent-color: var(--primary);
      }

      /* ====================
       Home
       ==================== */
      .app-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 0;
      }
      .progress-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 8px;
      }
      .bar {
        display: flex;
        height: 12px;
        border-radius: 999px;
        overflow: hidden;
        background: var(--track);
      }
      .bar-learned {
        background: var(--ok);
      }
      .bar-unsure {
        background: var(--warn);
      }
      .bar-wrong {
        background: var(--bad);
      }
      .bar-legend {
        display: flex;
        gap: 14px;
        margin-top: 6px;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .bar-legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-right: 4px;
        vertical-align: -1px;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 14px;
      }
      .stat {
        background: var(--bg);
        border-radius: 10px;
        padding: 8px 10px;
        text-align: center;
      }
      .stat b {
        display: block;
        font-size: 1.25rem;
        line-height: 1.3;
      }
      .stat span {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .stat.ok b {
        color: var(--ok);
      }
      .stat.bad b {
        color: var(--bad);
      }
      .stat.fav b {
        color: var(--fav);
      }
      .stat.warn b {
        color: var(--warn);
      }

      .resume {
        border-color: var(--primary);
        background: var(--primary-soft);
      }
      .resume p {
        margin-bottom: 10px;
      }

      .warning {
        border-color: var(--bad);
        background: var(--bad-bg);
        font-size: 0.9rem;
      }
      .warning ul {
        margin: 6px 0 0;
        padding-left: 20px;
      }

      /* ====================
       Quiz
       ==================== */
      .quiz-top {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
        background: var(--bg);
      }
      .icon-btn {
        flex: none;
        min-width: 48px;
        min-height: 48px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 1.3rem;
        line-height: 1;
        cursor: pointer;
        touch-action: manipulation;
      }
      .icon-btn.fav-on {
        color: var(--fav);
        border-color: var(--fav);
      }
      .quiz-title {
        flex: 1;
        text-align: center;
        font-weight: 700;
      }
      .quiz-title small {
        display: block;
        font-weight: 400;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .thin-bar {
        height: 4px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
      }
      .thin-bar div {
        height: 100%;
        background: var(--primary);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 14px 0 10px;
      }
      .pill {
        font-size: 0.8rem;
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--card);
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .pill.learned {
        color: var(--ok);
        border-color: var(--ok);
      }
      .pill.wrong {
        color: var(--bad);
        border-color: var(--bad);
      }
      .pill.unsure {
        color: var(--warn);
        border-color: var(--warn);
      }
      .tally {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin-top: 6px;
        font-size: 0.85rem;
        font-weight: 600;
      }
      .tally .ok {
        color: var(--ok);
      }
      .tally .warn {
        color: var(--warn);
      }
      .tally .bad {
        color: var(--bad);
      }
      .pill.multi {
        color: var(--primary);
        border-color: var(--primary);
        font-weight: 600;
      }
      .pill.level {
        color: var(--fav);
        border-color: var(--fav);
      }

      .q-image {
        margin: 0 0 12px;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: #fff; /* ảnh chụp màn hình thường nền trắng, giữ dễ đọc ở dark mode */
      }
      .q-image img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
      }
      .q-image.broken {
        background: var(--bad-bg);
        border-color: var(--bad);
        color: var(--bad);
        font-size: 0.88rem;
      }
      .q-image.broken img {
        display: none;
      }
      .q-image.broken::after {
        content: "⚠️ Không tải được ảnh (sai đường dẫn hoặc đang offline)";
      }
      .q-text {
        font-size: 1.05rem;
        white-space: pre-line;
        margin-bottom: 12px;
      }

      .vi-box {
        margin: 0 0 16px;
        padding: 0 14px;
        border: 1px dashed var(--border);
        border-radius: 12px;
        background: var(--card);
      }
      .vi-box.open {
        padding-bottom: 12px;
      }
      .vi-toggle {
        display: flex;
        align-items: center;
        width: 100%;
        min-height: 44px;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: var(--primary);
        font-weight: 600;
        text-align: left;
        cursor: pointer;
        touch-action: manipulation;
      }
      .choice-vi {
        display: block;
        margin-top: 4px;
        font-size: 0.88rem;
        color: var(--muted);
        white-space: pre-line;
      }

      .part {
        margin-bottom: 14px;
      }
      .part-label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0 8px;
        font-weight: 700;
      }

      .choice {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        width: 100%;
        margin: 0 0 10px;
        padding: 12px 14px;
        text-align: left;
        font: inherit;
        color: var(--text);
        background: var(--card);
        border: 2px solid var(--border);
        border-radius: 12px;
        cursor: pointer;
        touch-action: manipulation;
      }
      .choice[aria-disabled="true"] {
        cursor: default;
      }
      .choice .letter {
        flex: none;
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid var(--muted);
        font-size: 0.9rem;
        font-weight: 700;
      }
      .choice.multi .letter {
        border-radius: 7px;
      }
      .choice .choice-body {
        padding-top: 2px;
      }
      .choice .choice-text {
        white-space: pre-line;
      }
      .choice.selected {
        border-color: var(--primary);
        background: var(--primary-soft);
      }
      .choice.selected .letter {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .choice.correct {
        border-color: var(--ok);
        background: var(--ok-bg);
      }
      .choice.correct .letter {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      .choice.incorrect {
        border-color: var(--bad);
        background: var(--bad-bg);
      }
      .choice.incorrect .letter {
        background: var(--bad);
        border-color: var(--bad);
        color: #fff;
      }

      .feedback {
        border-radius: 12px;
        padding: 12px 14px;
        margin: 16px 0 12px;
        border: 1px solid;
      }
      .feedback.ok {
        background: var(--ok-bg);
        border-color: var(--ok);
      }
      .feedback.bad {
        background: var(--bad-bg);
        border-color: var(--bad);
      }
      .feedback-title {
        font-size: 1.1rem;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .feedback ul {
        margin: 4px 0 0;
        padding-left: 20px;
      }
      .knowledge {
        border-left: 4px solid var(--primary);
      }

      .action-bar {
        position: sticky;
        bottom: 0;
        z-index: 5;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 10px;
        padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
        background: var(--bg);
        border-top: 1px solid var(--border);
        margin-top: 12px;
      }
      .action-bar.rating {
        grid-template-columns: auto 1fr 1fr;
      }

      /* ====================
       Done screen
       ==================== */
      .done-score {
        font-size: 2.4rem;
        font-weight: 800;
        text-align: center;
        margin: 8px 0 0;
      }
      .done-sub {
        text-align: center;
        color: var(--muted);
        margin-bottom: 16px;
      }
      .stack {
        display: grid;
        gap: 10px;
      }

      /* ====================
       Modal & toast
       ==================== */
      .modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.5);
      }
      .modal-box {
        width: 100%;
        max-width: 400px;
        background: var(--card);
        border-radius: 16px;
        padding: 20px;
      }
      .modal-box h2 {
        font-size: 1.15rem;
      }
      .modal-box p {
        white-space: pre-line;
        color: var(--muted);
        margin-bottom: 18px;
      }
      .modal-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(90px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 60;
        max-width: calc(100% - 32px);
        padding: 10px 16px;
        border-radius: 10px;
        background: #222a33;
        color: #fff;
        font-size: 0.92rem;
        text-align: center;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section id="screen-home" class="screen"></section>
      <section id="screen-quiz" class="screen" hidden></section>
      <section id="screen-done" class="screen" hidden></section>
    </main>

    <div id="modal" class="modal" hidden>
      <div
        class="modal-box"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <h2 id="modal-title"></h2>
        <p id="modal-message"></p>
        <div class="modal-actions">
          <button type="button" id="modal-cancel" class="btn">Cancel</button>
          <button type="button" id="modal-ok" class="btn btn-primary">
            OK
          </button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script>
      "use strict";

      // ====================
      // Question Data
      // ====================
      // Thêm câu hỏi mới: copy một object và dán vào cuối mảng.
      // Văn bản nhiều dòng: dùng dấu backtick `...` rồi dán thẳng vào, không cần \n.
      //
      //   id          : số DUY NHẤT, không bao giờ đổi (tiến độ học gắn với id này)
      //   category    : phần thi, danh sách được lấy tự động. Dùng đúng 5 tên sau:
      //                 "1. Identity & Governance", "2. Storage", "3. Compute",
      //                 "4. Networking", "5. Monitoring & Backup"
      //   level       : độ khó 1 = Cơ bản (lý thuyết), 2 = Tình huống, 3 = Thực chiến (có bẫy)
      //                 học theo thứ tự: phần 1 → 5, trong mỗi phần từ dễ đến khó
      //   topic       : chủ đề con, ví dụ "RBAC", "SSPR" (tùy chọn)
      //   question    : đề bài gốc (原文, tiếng Nhật)
      //   questionVi  : bản dịch tiếng Việt (tùy chọn, hiện trong ô "Xem tiếng Việt" đang đóng)
      //   choices     : mảng các lựa chọn
      //   choicesVi   : bản dịch các lựa chọn (tùy chọn, cùng số phần tử với choices)
      //   answer      : vị trí đáp án đúng, đếm từ 0 (0 = A, 1 = B, ...)
      //                 câu nhiều đáp án: dùng mảng, ví dụ [0, 2]
      //   explanation : phân tích & giải thích (tùy chọn). **chữ đậm** được hỗ trợ
      //   knowledge   : kiến thức cần nhớ (tùy chọn)
      //   images      : ảnh minh họa hiện dưới đề bài (tùy chọn), mảng đường dẫn ảnh:
      //                 ["images/1004.png"]            file ảnh để trong thư mục images/ cạnh index.html
      //                 ["data:image/png;base64,..."]  ảnh nhúng thẳng vào code, học offline chắc chắn xem được
      //
      // Câu có nhiều câu hỏi con (ví dụ chọn cài đặt cho App1 và App2):
      // thay choices/choicesVi/answer bằng parts, mỗi phần có label riêng.
      //   parts: [
      //     { label: "App1", choices: [...], answer: 2 },
      //     { label: "App2", choices: [...], answer: 2 },
      //   ]
      // Câu chỉ được tính là đúng khi làm đúng TẤT CẢ các phần.
      //
      // Trộn đáp án: mỗi lượt học, thứ tự đáp án của câu 1 phần được trộn ngẫu nhiên.
      //   • Luôn ghi answer theo thứ tự GỐC trong mảng choices.
      //   • Trong explanation, nhắc tới đáp án bằng chữ cái ở ĐẦU DÒNG ("A. …", "B, C, D …"),
      //     "**C**", "(B sai)", "Đáp án: C" → app tự đổi chữ cái theo thứ tự mới.
      //   • Không muốn trộn (ví dụ đáp án có thứ tự logic): thêm fixedOrder: true.
      //   • Câu nhiều phần (parts) và câu mà đáp án toàn là số thì không bị trộn.

      const questions = [
        {
          id: 1001,
          category: "2. Storage",
          level: 3,
          topic: "Managed Identity + RBAC",
          question: `storage1という名前のAzureストレージアカウントをお持ちです。
            Azure App Service 上に app1 という名前のアプリと、Azure コンテナー インスタンスで実行される App2 という名前のアプリがあります。それぞれのアプリはマネージド ID を使用しています。
            App1とApp2が今後30日間、storage1からBLOBを読み取ることができるようにする必要があります。
            各アプリについて、storage1でどのような設定を行うべきですか？`,
          questionVi: `Bạn có một tài khoản Azure Storage tên là storage1.
            Bạn có ứng dụng app1 chạy trên Azure App Service và ứng dụng App2 chạy trên Azure Container Instances. Cả hai ứng dụng đều đang sử dụng Managed Identity (Định danh được quản lý).
            Bạn cần đảm bảo App1 và App2 có thể đọc BLOB từ storage1 trong vòng 30 ngày tới.

          questionVi: `Công ty bảo vệ ứng dụng 3 tầng ở Japan East (2 web, 2 app, 1 DB) sang Japan West bằng Azure Site Recovery. Khi failover, phải khởi động theo thứ tự DB → app → web, và chạy script giữa các bước.

          choices: [

          explanation: `**Recovery plan = "kịch bản" failover**

          knowledge: `Recovery plan: chia VM thành các group khởi động lần lượt, thêm script (runbook) và manual action trước/sau mỗi group.

      ];
      // ====================
      // Constants
      // ====================
      const STORAGE_KEY = "az104-study-state";
      const STATE_VERSION = 2;

      const STATUS = {
        NOT_STARTED: "not_started",
        LEARNED: "learned", // trả lời đúng và chắc chắn
        UNSURE: "unsure", // trả lời đúng nhưng còn mập mờ
        WRONG: "wrong",
      };
      const STATUS_VALUES = Object.values(STATUS);
      const STATUS_LABELS = {
        not_started: "Chưa học",
        learned: "Đã thuộc",
        unsure: "Mập mờ",
        wrong: "Làm sai",
      };

      // Tự đánh giá sau khi trả lời đúng.
      const CONFIDENCE = { SURE: "sure", UNSURE: "unsure" };

      // Các kiểu học: mỗi kiểu là một điều kiện trên progress của câu hỏi.
      //   new : mặc định khi bấm "Bắt đầu" (câu chưa làm lần nào)
      //   all : dùng khi đã học hết câu mới
      //   còn lại: các nút "Ôn lại" trên trang chủ
      const STUDY_MODES = {
        new: {
          label: "Câu mới",
          match: (p) => p.status === STATUS.NOT_STARTED,
        },
        all: {
          label: "Tất cả câu",
          match: () => true,
        },
        wrong: {
          label: "❌ Câu đã sai",
          match: (p) => p.status === STATUS.WRONG,
        },
        unsure: {
          label: "🤔 Câu mập mờ",
          match: (p) => p.status === STATUS.UNSURE,
        },
        correct: {
          label: "✅ Câu đã đúng",
          match: (p) =>
            p.status === STATUS.LEARNED || p.status === STATUS.UNSURE,
        },
        favorite: {
          label: "⭐ Yêu thích",
          match: (p) => p.favorite,
        },
      };
      const REVIEW_MODE_KEYS = ["wrong", "unsure", "correct", "favorite"];

      const LETTERS = "ABCDEFGHIJ";
      const DEFAULT_CATEGORY = "Khác";

      // Độ khó. Câu không ghi level được coi là mức 2.
      const LEVELS = {
        1: "★ Cơ bản",
        2: "★★ Tình huống",
        3: "★★★ Thực chiến",
      };
      const DEFAULT_LEVEL = 2;

      // ====================
      // Question Validation
      // ====================
      const questionById = new Map(); // key: String(id)
      const validQuestions = [];
      const questionWarnings = [];

      // part = { label, choices, choicesVi, answer }
      function getCorrectAnswers(part) {
        return Array.isArray(part.answer) ? part.answer : [part.answer];
      }

      // Câu thường được coi như câu có đúng 1 phần (không có label).
      function getParts(q) {
        if (Array.isArray(q.parts)) return q.parts;
        return [
          {
            label: "",
            choices: q.choices,
            choicesVi: q.choicesVi,
            answer: q.answer,
          },
        ];
      }

      function getPartLabel(parts, partIndex) {
        const label = parts[partIndex].label;
        if (label) return label;
        return parts.length > 1 ? `Phần ${partIndex + 1}` : "";
      }

      function getCategory(q) {
        return q.category || DEFAULT_CATEGORY;
      }

      function findPartProblem(part) {
        if (!part || typeof part !== "object") return "không phải object";
        if (!Array.isArray(part.choices) || part.choices.length < 2)
          return "choices phải có ít nhất 2 lựa chọn";
        const answers = getCorrectAnswers(part);
        const answerIsValid =
          answers.length > 0 &&
          answers.every(
            (a) => Number.isInteger(a) && a >= 0 && a < part.choices.length,
          );
        if (!answerIsValid) return "answer không hợp lệ (đếm từ 0)";
        if (
          part.choicesVi !== undefined &&
          (!Array.isArray(part.choicesVi) ||
            part.choicesVi.length !== part.choices.length)
        )
          return "choicesVi phải có cùng số phần tử với choices";
        return null;
      }

      // Cho phép viết images: "a.png" (một ảnh) hoặc images: ["a.png", "b.png"].
      function getImages(q) {
        if (q.images === undefined || q.images === null) return [];
        return Array.isArray(q.images) ? q.images : [q.images];
      }

      function findQuestionProblem(q, seenIds) {
        if (!q || typeof q !== "object") return "không phải object";
        if (typeof q.id !== "number" && typeof q.id !== "string")
          return "thiếu id";
        if (seenIds.has(String(q.id))) return "trùng id với câu khác";
        if (!q.question) return "thiếu nội dung question";
        if (q.level !== undefined && !LEVELS[q.level])
          return "level phải là 1, 2 hoặc 3";
        if (!getImages(q).every((src) => typeof src === "string" && src.trim()))
          return "images phải là mảng đường dẫn ảnh";
        if (Array.isArray(q.parts) && q.parts.length === 0)
          return "parts không được rỗng";
        const parts = getParts(q);
        for (let i = 0; i < parts.length; i++) {
          const problem = findPartProblem(parts[i]);
          if (problem) {
            const where = parts.length > 1 ? `${getPartLabel(parts, i)}: ` : "";
            return where + problem;
          }
        }
        return null;
      }

      // Câu hỏi lỗi sẽ bị bỏ qua và hiển thị cảnh báo trên trang chủ.
      function prepareQuestions() {
        const seenIds = new Set();
        questions.forEach((q, index) => {
          const problem = findQuestionProblem(q, seenIds);
          if (problem) {
            const idText = q && q.id !== undefined ? ` (id ${q.id})` : "";
            questionWarnings.push(
              `Phần tử thứ ${index + 1}${idText}: ${problem}`,
            );
            return;
          }
          seenIds.add(String(q.id));
          questionById.set(String(q.id), q);
          validQuestions.push(q);
        });
      }

      // ====================
      // State Management
      // ====================
      // state = {
      //   version,
      //   progress: { "<questionId>": { status, favorite, attempts, correctCount, unsureCount, wrongCount, lastAnsweredAt } },
      //   settings: { categories: "all" | ["Storage", ...], shuffle },
      //   session:  { ids: [...], index, answers: { "<questionId>": { selected: [[...] mỗi phần], correct, confidence } }, label } | null
      // }
      let state;
      // Trạng thái tạm của câu đang làm, reset khi sang câu khác.
      let selectedChoices = []; // lựa chọn chưa bấm Check, mỗi phần một mảng: [[0], [2]]
      let viOpen = false; // ô "Xem tiếng Việt" đang mở

      function resetQuestionUi() {
        selectedChoices = [];
        viOpen = false;
      }

      function createDefaultState() {
        return {
          version: STATE_VERSION,
          progress: {},
          settings: {
            categories: "all",
            shuffle: false,
          },
          session: null,
        };
      }

      function createDefaultProgress() {
        return {
          status: STATUS.NOT_STARTED,
          favorite: false,
          attempts: 0,
          correctCount: 0,
          unsureCount: 0,
          wrongCount: 0,
          lastAnsweredAt: null,
        };
      }

      // Câu chưa có trong state => not_started.
      function getProgress(id) {
        return Object.assign(
          createDefaultProgress(),
          state.progress[String(id)],
        );
      }

      function updateProgress(id, changes) {
        state.progress[String(id)] = Object.assign(getProgress(id), changes);
        saveState();
      }

      // Quy tắc trạng thái (lần trả lời gần nhất quyết định):
      //   sai                    => wrong
      //   đúng                   => learned
      //   đúng + tự chọn Mập mờ  => unsure (xem recordConfidence)
      function recordAnswer(id, isCorrect) {
        const p = getProgress(id);
        updateProgress(id, {
          status: isCorrect ? STATUS.LEARNED : STATUS.WRONG,
          attempts: p.attempts + 1,
          correctCount: p.correctCount + (isCorrect ? 1 : 0),
          wrongCount: p.wrongCount + (isCorrect ? 0 : 1),
          lastAnsweredAt: new Date().toISOString(),
        });
      }

      function recordConfidence(id, confidence) {
        if (confidence !== CONFIDENCE.UNSURE) return;
        const p = getProgress(id);
        updateProgress(id, {
          status: STATUS.UNSURE,
          unsureCount: p.unsureCount + 1,
        });
      }

      function toggleFavorite(id) {
        updateProgress(id, { favorite: !getProgress(id).favorite });
      }

      function updateSettings(changes) {
        Object.assign(state.settings, changes);
        saveState();
      }

      function toCount(value) {
        return Number.isInteger(value) && value >= 0 ? value : 0;
      }

      function normalizeProgress(p) {
        const source = p && typeof p === "object" ? p : {};
        return {
          status: STATUS_VALUES.includes(source.status)
            ? source.status
            : STATUS.NOT_STARTED,
          favorite: source.favorite === true,
          attempts: toCount(source.attempts),
          correctCount: toCount(source.correctCount),
          unsureCount: toCount(source.unsureCount),
          wrongCount: toCount(source.wrongCount),
          lastAnsweredAt:
            typeof source.lastAnsweredAt === "string"
              ? source.lastAnsweredAt
              : null,
        };
      }

      function normalizeSettings(raw) {
        const result = createDefaultState().settings;
        if (!raw || typeof raw !== "object") return result;

        // Phiên bản 1 dùng "category" (một category).
        if (Array.isArray(raw.categories)) {
          result.categories = raw.categories.filter(
            (c) => typeof c === "string",
          );
        } else if (typeof raw.category === "string" && raw.category !== "all") {
          result.categories = [raw.category];
        }
        result.shuffle = raw.shuffle === true;
        return result;
      }

      function normalizeSession(s) {
        if (!s || typeof s !== "object" || !Array.isArray(s.ids)) return null;
        return {
          ids: s.ids.map(String),
          index: toCount(s.index),
          answers: s.answers && typeof s.answers === "object" ? s.answers : {},
          orders: s.orders && typeof s.orders === "object" ? s.orders : {},
          label: typeof s.label === "string" ? s.label : "",
        };
      }

      // Chuẩn hóa dữ liệu đọc từ localStorage để app không bị lỗi với dữ liệu cũ.
      function normalizeState(raw) {
        const result = createDefaultState();
        if (!raw || typeof raw !== "object") return result;

        if (
          raw.progress &&
          typeof raw.progress === "object" &&
          !Array.isArray(raw.progress)
        ) {
          for (const [id, p] of Object.entries(raw.progress)) {
            result.progress[id] = normalizeProgress(p);
          }
        }
        result.settings = normalizeSettings(raw.settings);
        result.session = normalizeSession(raw.session);
        return result;
      }

      // Bỏ các câu trong phiên học không còn tồn tại (ví dụ đã xóa khỏi questions).
      function cleanSession() {
        const s = state.session;
        if (!s) return;
        s.ids = s.ids.filter((id) => questionById.has(id));
        if (s.ids.length === 0) {
          state.session = null;
          return;
        }
        s.index = Math.min(s.index, s.ids.length);
      }

      // ====================
      // LocalStorage
      // ====================
      function loadState() {
        let raw;
        try {
          raw = localStorage.getItem(STORAGE_KEY);
        } catch (err) {
          console.warn("localStorage không khả dụng", err);
          return createDefaultState();
        }
        if (!raw) return createDefaultState();
        try {
          return normalizeState(JSON.parse(raw));
        } catch (err) {
          // Dữ liệu hỏng: giữ lại bản sao để có thể cứu, rồi bắt đầu state mới.
          console.warn("State bị hỏng, đã lưu bản sao", err);
          try {
            localStorage.setItem(STORAGE_KEY + "-corrupt", raw);
          } catch (e) {
            /* bỏ qua */
          }
          return createDefaultState();
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          console.warn("Không lưu được state", err);
          showToast(
            "⚠️ Không lưu được tiến độ (trình duyệt chặn localStorage?)",
          );
        }
      }

      // ====================
      // Question Filtering
      // ====================
      function getCategories() {
        return [...new Set(validQuestions.map(getCategory))].sort((a, b) =>
          a.localeCompare(b),
        );
      }

      // settings.categories = "all" nghĩa là mọi mục, kể cả mục mới thêm sau này.
      function getSelectedCategories() {
        const saved = state.settings.categories;
        const all = getCategories();
        return saved === "all" ? all : all.filter((c) => saved.includes(c));
      }

      function setSelectedCategories(list) {
        const isAll = list.length > 0 && list.length === getCategories().length;
        updateSettings({ categories: isAll ? "all" : list });
      }

      function toggleCategory(category) {
        const selected = getSelectedCategories();
        setSelectedCategories(
          selected.includes(category)
            ? selected.filter((c) => c !== category)
            : selected.concat(category),
        );
      }

      function toggleAllCategories() {
        const allSelected =
          getSelectedCategories().length === getCategories().length;
        updateSettings({ categories: allSelected ? [] : "all" });
      }

      function questionsInCategories(categories) {
        return validQuestions.filter((q) =>
          categories.includes(getCategory(q)),
        );
      }

      // Các câu thuộc mục đã chọn và khớp kiểu học (xem STUDY_MODES).
      function getStudyList(modeKey) {
        const mode = STUDY_MODES[modeKey];
        return questionsInCategories(getSelectedCategories()).filter((q) =>
          mode.match(getProgress(q.id)),
        );
      }

      // Thống kê luôn tính lại từ state, không lưu riêng.
      function computeStats(list) {
        const stats = {
          total: list.length,
          not_started: 0,
          learned: 0,
          unsure: 0,
          wrong: 0,
          favorite: 0,
          attempts: 0,
          correct: 0,
        };
        list.forEach((q) => {
          const p = getProgress(q.id);
          stats[p.status]++;
          if (p.favorite) stats.favorite++;
          stats.attempts += p.attempts;
          stats.correct += p.correctCount;
        });
        stats.accuracy = stats.attempts
          ? Math.round((stats.correct / stats.attempts) * 100)
          : null;
        return stats;
      }

      function shuffleArray(items) {
        const copy = items.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      // ====================
      // Quiz Logic
      // ====================
      function startSession(ids, label, startIndex = 0) {
        if (!ids.length) return;
        state.session = {
          ids: ids.map(String),
          index: startIndex,
          answers: {},
          orders: {}, // thứ tự hiển thị đáp án đã trộn của từng câu trong phiên
          label,
        };
        resetQuestionUi();
        saveState();
        openQuizScreen();
      }

      function buildSessionLabel(modeKey) {
        const selected = getSelectedCategories();
        const categoryText =
          selected.length === getCategories().length
            ? "Tất cả mục"
            : selected.join(", ");
        return `${STUDY_MODES[modeKey].label} · ${categoryText}`;
      }

      function getLevel(q) {
        return q.level || DEFAULT_LEVEL;
      }

      // Thứ tự học mặc định: theo phần (tên category), trong mỗi phần từ dễ đến khó.
      // Cùng phần, cùng độ khó thì giữ thứ tự trong mảng questions.
      function sortByStudyOrder(list) {
        return list.slice().sort(
          (a, b) =>
            getCategory(a).localeCompare(getCategory(b)) ||
            getLevel(a) - getLevel(b),
        );
      }

      // Lấy toàn bộ câu khớp kiểu học trong các mục đã chọn, không giới hạn số câu.
      function startStudy(modeKey) {
        let list = getStudyList(modeKey);
        list = state.settings.shuffle
          ? shuffleArray(list)
          : sortByStudyOrder(list);
        startSession(
          list.map((q) => q.id),
          buildSessionLabel(modeKey),
        );
      }

      function currentQuestion() {
        const s = state.session;
        return s && s.index < s.ids.length
          ? questionById.get(s.ids[s.index])
          : null;
      }

      function currentAnswer() {
        const q = currentQuestion();
        return q ? state.session.answers[String(q.id)] : null;
      }

      // Đúng nhưng chưa tự đánh giá chắc chắn / mập mờ.
      function needsRating(answer) {
        return Boolean(answer && answer.correct && !answer.confidence);
      }

      function isSameSet(a, b) {
        return a.length === b.length && a.every((x) => b.includes(x));
      }

      // Lựa chọn đã lưu, mỗi phần một mảng. Dữ liệu cũ (mảng phẳng) được coi là 1 phần.
      function getAnswerSelections(answer) {
        const selected = answer.selected || [];
        return selected.length && !Array.isArray(selected[0])
          ? [selected]
          : selected;
      }

      function isPartCorrect(part, selection) {
        return isSameSet(selection || [], getCorrectAnswers(part));
      }

      function isSelectionComplete(q) {
        return getParts(q).every((_, i) => (selectedChoices[i] || []).length);
      }

      function selectChoice(partIndex, index) {
        const q = currentQuestion();
        if (!q || currentAnswer()) return;
        const part = getParts(q)[partIndex];
        if (!part || !Number.isInteger(index) || index >= part.choices.length)
          return;
        const current = selectedChoices[partIndex] || [];
        if (getCorrectAnswers(part).length > 1) {
          selectedChoices[partIndex] = current.includes(index)
            ? current.filter((i) => i !== index)
            : current.concat(index);
        } else {
          selectedChoices[partIndex] = [index];
        }
        renderQuiz();
      }

      function checkAnswer() {
        const q = currentQuestion();
        if (!q || currentAnswer() || !isSelectionComplete(q)) return;
        const parts = getParts(q);
        const selections = parts.map((_, i) => selectedChoices[i].slice());
        const isCorrect = parts.every((part, i) =>
          isPartCorrect(part, selections[i]),
        );
        state.session.answers[String(q.id)] = {
          selected: selections,
          correct: isCorrect,
          confidence: null,
        };
        recordAnswer(q.id, isCorrect); // cũng lưu luôn session
        renderQuiz();
        const feedback = document.getElementById("feedback");
        if (feedback) feedback.scrollIntoView({ block: "nearest" });
      }

      // Sang câu tiếp. Câu đúng chưa được đánh giá thì ghi nhận theo confidence (mặc định: chắc chắn).
      function goNext(confidence = CONFIDENCE.SURE) {
        const q = currentQuestion();
        const answer = currentAnswer();
        if (q && needsRating(answer)) {
          answer.confidence = confidence;
          recordConfidence(q.id, confidence);
        }
        goToQuestion(state.session.index + 1);
      }

      function goToQuestion(index) {
        const s = state.session;
        if (!s) return;
        s.index = Math.max(0, Math.min(index, s.ids.length));
        resetQuestionUi();
        saveState();
        route();
        window.scrollTo(0, 0);
      }

      // Kết quả một câu trong phiên: "sure" | "unsure" | "wrong" | null (chưa làm).
      function answerOutcome(answer) {
        if (!answer) return null;
        if (!answer.correct) return "wrong";
        return answer.confidence === CONFIDENCE.UNSURE ? "unsure" : "sure";
      }

      function getSessionResults() {
        const s = state.session;
        const result = { sure: 0, unsure: 0, wrong: 0, reviewIds: [] };
        s.ids.forEach((id) => {
          const outcome = answerOutcome(s.answers[id]);
          if (!outcome) return;
          result[outcome]++;
          if (outcome !== "sure") result.reviewIds.push(id);
        });
        result.answered = result.sure + result.unsure + result.wrong;
        return result;
      }

      function endSession() {
        state.session = null;
        resetQuestionUi();
        saveState();
      }

      // ====================
      // Navigation
      // ====================
      // Dùng #quiz trên URL để nút Back của điện thoại quay về trang chủ.
      function openQuizScreen() {
        if (location.hash === "#quiz") route();
        else location.hash = "quiz";
      }

      function goHome() {
        if (location.hash === "#quiz") history.back();
        else route();
      }

      function route() {
        const s = state.session;
        let screen = "home";
        if (location.hash === "#quiz" && s) {
          screen = s.index >= s.ids.length ? "done" : "quiz";
        } else if (s && s.index >= s.ids.length) {
          endSession(); // rời màn hình kết quả => kết thúc phiên
        }
        showScreen(screen);
      }

      function showScreen(name) {
        for (const key of ["home", "quiz", "done"]) {
          document.getElementById("screen-" + key).hidden = key !== name;
        }
        if (name === "home") renderHome();
        if (name === "quiz") renderQuiz();
        if (name === "done") renderDone();
      }

      // ====================
      // Rendering
      // ====================
      function escapeHtml(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function statHtml(value, label, cls = "") {
        return `<div class="stat ${cls}"><b>${value}</b><span>${label}</span></div>`;
      }

      // Một hàng chọn (checkbox/radio). label và hint phải được escape trước khi truyền vào.
      function optionHtml({
        input,
        checked,
        label,
        hint = "",
        count,
        extraClass = "",
      }) {
        return `<label class="option ${checked ? "checked" : ""} ${extraClass}">
            ${input}
            <span class="option-main">
                <span class="option-label">${label}</span>
                ${hint ? `<span class="option-hint">${hint}</span>` : ""}
            </span>
            <span class="option-count">${count}</span>
        </label>`;
      }

      function renderWarnings() {
        if (!questionWarnings.length) return "";
        return `<div class="card warning">
        <strong>⚠️ ${questionWarnings.length} câu hỏi bị bỏ qua do dữ liệu lỗi:</strong>
        <ul>${questionWarnings.map((w) => `<li>${escapeHtml(w)}</li>`).join("")}</ul>
    </div>`;
      }

      function renderResumeCard() {
        const s = state.session;
        if (!s || s.index >= s.ids.length) return "";
        return `<div class="card resume">
        <h2>Đang học dở</h2>
        <p class="small muted">${escapeHtml(s.label)} · câu ${s.index + 1} / ${s.ids.length}</p>
        <button type="button" class="btn btn-primary btn-block" data-action="resume">▶ Tiếp tục</button>
    </div>`;
      }

      function renderCategoryCard() {
        const categories = getCategories();
        const selected = getSelectedCategories();
        const allChecked =
          categories.length > 0 && selected.length === categories.length;

        const rows = categories
          .map((category) => {
            const stats = computeStats(questionsInCategories([category]));
            const hintParts = [`Đã thuộc ${stats.learned}/${stats.total}`];
            if (stats.unsure) hintParts.push(`mập mờ ${stats.unsure}`);
            if (stats.wrong) hintParts.push(`sai ${stats.wrong}`);
            const checked = selected.includes(category);
            return optionHtml({
              input: `<input type="checkbox" data-category="${escapeHtml(category)}" ${checked ? "checked" : ""}>`,
              checked,
              label: escapeHtml(category),
              hint: hintParts.join(" · "),
              count: stats.total,
            });
          })
          .join("");

        return `<div class="card">
        <h2>Bạn muốn ôn mục nào?</h2>
        <p class="small muted">Có thể chọn nhiều mục.</p>
        <div class="option-list">
            ${optionHtml({
              input: `<input type="checkbox" id="category-all" ${allChecked ? "checked" : ""}>`,
              checked: allChecked,
              label: "Tất cả các mục",
              count: validQuestions.length,
              extraClass: "option-all",
            })}
            ${rows}
        </div>
        <label class="switch-row" style="margin:12px 0 0">
            <input type="checkbox" id="shuffle-toggle" ${state.settings.shuffle ? "checked" : ""}>
            <span>🔀 Random thứ tự câu hỏi</span>
        </label>
    </div>`;
      }

      // Nút chính: học các câu mới trong mục đã chọn. Hết câu mới thì cho làm lại tất cả.
      function renderStartBar() {
        const inScope = questionsInCategories(getSelectedCategories());
        const newCount = getStudyList("new").length;
        let hint = "";
        let button;
        if (!inScope.length) {
          hint = validQuestions.length
            ? "Hãy chọn ít nhất một mục."
            : "Chưa có câu hỏi nào. Hãy thêm câu hỏi vào mảng questions.";
          button = `<button type="button" class="btn btn-primary btn-block" disabled>▶ Bắt đầu</button>`;
        } else if (newCount) {
          button = `<button type="button" class="btn btn-primary btn-block" data-action="start" data-mode="new">▶ Bắt đầu</button>`;
        } else {
          hint = "🎉 Đã làm hết câu mới trong các mục đã chọn.";
          button = `<button type="button" class="btn btn-primary btn-block" data-action="start" data-mode="all">🔁 Làm lại tất cả</button>`;
        }
        return `<div class="start-bar">
        ${hint ? `<p class="small muted" style="text-align:center">${hint}</p>` : ""}
        ${button}
    </div>`;
      }

      function renderReviewCard() {
        const buttons = REVIEW_MODE_KEYS.map((key) => {
          const count = getStudyList(key).length;
          return `<button type="button" class="btn review-btn" data-action="start" data-mode="${key}" ${count ? "" : "disabled"}>
            <span>${STUDY_MODES[key].label}</span><span class="review-count">${count}</span>
        </button>`;
        }).join("");
        return `<div class="card">
        <h2>Ôn lại</h2>
        <p class="small muted">Chỉ lấy câu trong các mục đã chọn.</p>
        <div class="review-grid">${buttons}</div>
    </div>`;
      }

      function renderProgressCard() {
        const stats = computeStats(validQuestions);
        const pct = (n) =>
          stats.total ? ((n / stats.total) * 100).toFixed(1) : 0;
        return `<div class="card">
        <div class="progress-head">
            <h2 style="margin:0">Tổng quan</h2>
            <strong>${stats.learned} / ${stats.total} đã thuộc</strong>
        </div>
        <div class="bar" aria-hidden="true">
            <div class="bar-learned" style="width:${pct(stats.learned)}%"></div>
            <div class="bar-unsure" style="width:${pct(stats.unsure)}%"></div>
            <div class="bar-wrong" style="width:${pct(stats.wrong)}%"></div>
        </div>
        <div class="bar-legend">
            <span><i style="background:var(--ok)"></i>Đã thuộc</span>
            <span><i style="background:var(--warn)"></i>Mập mờ</span>
            <span><i style="background:var(--bad)"></i>Làm sai</span>
        </div>
        <div class="stats-grid">
            ${statHtml(stats.not_started, "Chưa học")}
            ${statHtml(stats.learned, "Đã thuộc", "ok")}
            ${statHtml(stats.unsure, "Mập mờ", "warn")}
            ${statHtml(stats.wrong, "Làm sai", "bad")}
            ${statHtml(stats.favorite, "Yêu thích", "fav")}
            ${statHtml(stats.accuracy === null ? "—" : stats.accuracy + "%", "Chính xác")}
        </div>
    </div>`;
      }

      function renderDataCard() {
        return `<div class="card">
        <h2>Dữ liệu</h2>
        <p class="small muted">Tiến độ được tự động lưu trong trình duyệt này.</p>
        <button type="button" class="btn btn-danger-outline btn-block" data-action="reset">Reset Progress</button>
    </div>`;
      }

      function renderHome() {
        document.getElementById("screen-home").innerHTML = `
        <header class="app-header">
            <h1>AZ-104 Study</h1>
            <span class="small muted">${validQuestions.length} câu hỏi</span>
        </header>
        ${renderWarnings()}
        ${renderResumeCard()}
        ${renderCategoryCard()}
        ${renderStartBar()}
        ${renderReviewCard()}
        ${renderProgressCard()}
        ${renderDataCard()}`;
      }

      // Văn bản trong dữ liệu câu hỏi: bỏ khoảng trắng đầu/cuối, hỗ trợ **chữ đậm**.
      // Xuống dòng được giữ nhờ class "pre" (white-space: pre-line).
      function formatText(text) {
        return escapeHtml(String(text ?? "").trim()).replace(
          /\*\*(.+?)\*\*/g,
          "<strong>$1</strong>",
        );
      }

      // Bản dịch của một lựa chọn; bỏ qua nếu giống hệt bản gốc (ví dụ tên lệnh, tên dịch vụ).
      function getChoiceVi(part, index) {
        const vi = part.choicesVi && part.choicesVi[index];
        if (!vi || String(vi).trim() === String(part.choices[index]).trim())
          return "";
        return vi;
      }

      // Dòng dịch nhỏ dưới đáp án, chỉ hiện khi đang bật "Xem tiếng Việt".
      function renderChoiceVi(part, index) {
        const vi = viOpen ? getChoiceVi(part, index) : "";
        return vi ? `<span class="choice-vi">${formatText(vi)}</span>` : "";
      }

      // ====================
      // Choice Shuffling
      // ====================
      // Mỗi phiên học trộn thứ tự đáp án để người học không nhớ "vị trí" đáp án.
      // Dữ liệu (answer, lựa chọn đã chọn) luôn dùng chỉ số GỐC; chỉ lúc hiển thị mới đổi thứ tự.
      // Không trộn: câu nhiều phần (Yes/No, App1/App2), câu có fixedOrder: true,
      // và câu mà mọi lựa chọn đều là số (1, 2, 5, /29, 99.9%…).
      function shouldShuffle(q) {
        if (Array.isArray(q.parts) || q.fixedOrder) return false;
        return !q.choices.every((c) =>
          /^\s*(?:[\d.,%]+|\/\d+)\s*$/.test(String(c)),
        );
      }

      // order[vị trí hiển thị] = chỉ số gốc.
      function getChoiceOrder(q, partIndex) {
        const count = getParts(q)[partIndex].choices.length;
        const identity = [...Array(count).keys()];
        const s = state.session;
        if (partIndex !== 0 || !s || !shouldShuffle(q)) return identity;
        const key = String(q.id);
        const saved = s.orders[key];
        const isValid =
          Array.isArray(saved) &&
          saved.length === count &&
          identity.every((i) => saved.includes(i));
        if (!isValid) {
          s.orders[key] = shuffleArray(identity);
          saveState();
        }
        return s.orders[key];
      }

      // Đổi các chữ cái A/B/C/D trong phần giải thích theo thứ tự hiển thị mới.
      // Nhận các dạng: đầu dòng "A. ", "B, C, D ", "B và D:", "**C**", "**C. …**", "(B sai)",
      // "Đáp án: B", "Bẫy D". Dùng ký hiệu tạm để không đổi một chữ hai lần.
      function remapChoiceLetters(text, order) {
        if (!text || order.every((o, p) => o === p)) return text;
        const displayOf = {};
        order.forEach((o, p) => (displayOf[LETTERS[o]] = p));
        const mark = (letter) =>
          letter in displayOf ? `${displayOf[letter]}` : letter;
        return String(text)
          .replace(
            /^(\s*)([A-J](?:(?:, | và |,)[A-J])*)(?=[.,:]|\s|$)/gm,
            (m, space, list) => space + list.replace(/[A-J]/g, mark),
          )
          .replace(/\*\*([A-J])(?=[.*])/g, (m, l) => "**" + mark(l))
          .replace(/\(([A-J])(?=[ )])/g, (m, l) => "(" + mark(l))
          .replace(
            /([Đđ]áp án:?[ \t]*)([A-J])(?=[.\s]|$)/g,
            (m, p, l) => p + mark(l),
          )
          .replace(/([Bb]ẫy )([A-J])(?=\W|$)/g, (m, p, l) => p + mark(l))
          .replace(/(\d+)/g, (m, p) => LETTERS[Number(p)]);
      }

      function renderPartChoices(part, partIndex, shown, answered, order) {
        const correct = getCorrectAnswers(part);
        const multi = correct.length > 1;
        return order
          .map((i, position) => {
            const text = part.choices[i];
            const classes = ["choice"];
            if (multi) classes.push("multi");
            let mark = LETTERS[position];
            if (answered) {
              if (correct.includes(i)) {
                classes.push("correct");
                mark = "✓";
              } else if (shown.includes(i)) {
                classes.push("incorrect");
                mark = "✗";
              }
            } else if (shown.includes(i)) {
              classes.push("selected");
            }
            return `<button type="button" class="${classes.join(" ")}" data-action="choose" data-part="${partIndex}" data-index="${i}"
            aria-pressed="${shown.includes(i)}" ${answered ? 'aria-disabled="true"' : ""}>
            <span class="letter">${mark}</span>
            <span class="choice-body">
                <span class="choice-text">${formatText(text)}</span>
                ${renderChoiceVi(part, i)}
            </span>
        </button>`;
          })
          .join("");
      }

      function renderParts(q, answer) {
        const parts = getParts(q);
        const selections = answer
          ? getAnswerSelections(answer)
          : selectedChoices;
        return parts
          .map((part, pi) => {
            const shown = selections[pi] || [];
            const label = getPartLabel(parts, pi);
            const correctCount = getCorrectAnswers(part).length;
            const pill =
              correctCount > 1
                ? `<span class="pill multi">Chọn ${correctCount} đáp án</span>`
                : "";
            const header =
              label || pill
                ? `<div class="part-label">${label ? escapeHtml(label) : ""}${pill}</div>`
                : "";
            return `<div class="part">${header}${renderPartChoices(part, pi, shown, Boolean(answer), getChoiceOrder(q, pi))}</div>`;
          })
          .join("");
      }

      // Ảnh minh họa của đề. Ảnh không tải được (sai đường dẫn, đang offline) thì hiện thông báo thay vì ảnh vỡ.
      function renderImages(q) {
        return getImages(q)
          .map(
            (src) => `<figure class="q-image">
            <img src="${escapeHtml(src)}" alt="Hình minh họa" loading="lazy"
                onerror="this.parentNode.classList.add('broken')">
        </figure>`,
          )
          .join("");
      }

      function hasVietnamese(q) {
        return (
          Boolean(q.questionVi) ||
          getParts(q).some((part) =>
            part.choices.some((_, i) => getChoiceVi(part, i)),
          )
        );
      }

      // Nút bật/tắt tiếng Việt, mặc định tắt. Khi bật: hiện bản dịch đề bài ở đây,
      // và bản dịch từng đáp án ngay dưới đáp án đó.
      function renderViBox(q) {
        if (!hasVietnamese(q)) return "";
        return `<div class="vi-box ${viOpen ? "open" : ""}">
            <button type="button" class="vi-toggle" data-action="toggle-vi" aria-expanded="${viOpen}">
                🇻🇳 ${viOpen ? "Ẩn tiếng Việt" : "Xem tiếng Việt"}
            </button>
            ${viOpen && q.questionVi ? `<div class="pre">${formatText(q.questionVi)}</div>` : ""}
        </div>`;
      }

      function renderResultBox(q, answer) {
        if (!answer.correct) {
          const parts = getParts(q);
          const selections = getAnswerSelections(answer);
          const correctList = parts
            .map((part, pi) => {
              const label = getPartLabel(parts, pi);
              const order = getChoiceOrder(q, pi);
              const choices = getCorrectAnswers(part)
                .slice()
                .sort((a, b) => order.indexOf(a) - order.indexOf(b))
                .map((i) => {
                  const vi = viOpen ? getChoiceVi(part, i) : "";
                  return `<strong>${LETTERS[order.indexOf(i)]}.</strong> ${formatText(part.choices[i])}${vi ? `<span class="choice-vi">${formatText(vi)}</span>` : ""}`;
                })
                .join(", ");
              const mark =
                parts.length > 1
                  ? isPartCorrect(part, selections[pi])
                    ? " ✅"
                    : " ❌"
                  : "";
              const shortLabel = label.replace(/[。.．]\s*$/, "");
              return `<li>${shortLabel ? `${escapeHtml(shortLabel)}: ` : ""}${choices}${mark}</li>`;
            })
            .join("");
          return `<div class="feedback bad" id="feedback">
               <div class="feedback-title">❌ Incorrect</div>
               <div>Correct answer:</div><ul>${correctList}</ul>
           </div>`;
        }
        let note;
        if (needsRating(answer))
          note = "Bạn chắc chắn hay còn mập mờ? Chọn ở nút bên dưới.";
        else if (answer.confidence === CONFIDENCE.UNSURE)
          note = "Bạn đã đánh dấu: 🤔 Mập mờ";
        else note = "Bạn đã đánh dấu: Chắc chắn";
        return `<div class="feedback ok" id="feedback">
            <div class="feedback-title">✅ Correct</div>
            <div class="small">${note}</div>
        </div>`;
      }

      function renderFeedback(q, answer) {
        if (!answer) return "";
        const p = getProgress(q.id);
        const order = getChoiceOrder(q, 0);
        const explanation = remapChoiceLetters(q.explanation, order);
        const knowledge = remapChoiceLetters(q.knowledge, order);
        return `${renderResultBox(q, answer)}
        ${explanation ? `<div class="card"><h3>📝 Phân tích & giải thích</h3><div class="pre">${formatText(explanation)}</div></div>` : ""}
        ${knowledge ? `<div class="card knowledge"><h3>📘 Kiến thức cần nhớ</h3><div class="pre">${formatText(knowledge)}</div></div>` : ""}
        <p class="small muted">Câu này: đã làm ${p.attempts} lần · đúng ${p.correctCount} (mập mờ ${p.unsureCount}) · sai ${p.wrongCount}</p>`;
      }

      function renderActionBar(q, answer, isLast, isFirst) {
        const prev = `<button type="button" class="btn" data-action="prev" ${isFirst ? "disabled" : ""} aria-label="Câu trước">‹</button>`;
        if (!answer) {
          return `<div class="action-bar">${prev}
            <button type="button" class="btn btn-primary" data-action="check" ${isSelectionComplete(q) ? "" : "disabled"}>Check Answer</button>
        </div>`;
        }
        if (needsRating(answer)) {
          return `<div class="action-bar rating">${prev}
            <button type="button" class="btn btn-warn" data-action="rate" data-confidence="${CONFIDENCE.UNSURE}">🤔 Mập mờ</button>
            <button type="button" class="btn btn-ok" data-action="rate" data-confidence="${CONFIDENCE.SURE}">✅ Chắc chắn</button>
        </div>`;
        }
        return `<div class="action-bar">${prev}
            <button type="button" class="btn btn-primary" data-action="next">${isLast ? "Xem kết quả" : "Next Question ›"}</button>
        </div>`;
      }

      function renderQuiz() {
        const s = state.session;
        const q = currentQuestion();
        if (!q) {
          route();
          return;
        }

        const answer = currentAnswer();
        const p = getProgress(q.id);
        const r = getSessionResults();

        document.getElementById("screen-quiz").innerHTML = `
        <div class="quiz-top">
            <button type="button" class="icon-btn" data-action="home" aria-label="Về trang chủ">⌂</button>
            <div class="quiz-title">Question ${s.index + 1} / ${s.ids.length}<small>${escapeHtml(s.label)}</small></div>
            <button type="button" class="icon-btn ${p.favorite ? "fav-on" : ""}" data-action="favorite"
                aria-label="Yêu thích" aria-pressed="${p.favorite}">${p.favorite ? "★" : "☆"}</button>
        </div>
        <div class="thin-bar"><div style="width:${(r.answered / s.ids.length) * 100}%"></div></div>
        <div class="tally">
            <span class="ok">✅ ${r.sure} chắc</span>
            <span class="warn">🤔 ${r.unsure} mập mờ</span>
            <span class="bad">❌ ${r.wrong} sai</span>
        </div>
        <div class="meta">
            <span class="pill">${escapeHtml(getCategory(q))}</span>
            ${q.topic ? `<span class="pill">${escapeHtml(q.topic)}</span>` : ""}
            <span class="pill level">${LEVELS[getLevel(q)]}</span>
            <span class="pill ${p.status}">${STATUS_LABELS[p.status]}</span>
            <span class="pill">#${escapeHtml(q.id)}</span>
        </div>
        <div class="q-text pre" lang="ja">${formatText(q.question)}</div>
        ${renderImages(q)}
        ${renderViBox(q)}
        ${renderParts(q, answer)}
        ${renderFeedback(q, answer)}
        ${renderActionBar(q, answer, s.index === s.ids.length - 1, s.index === 0)}`;
      }

      function renderDone() {
        const s = state.session;
        const r = getSessionResults();
        const skipped = s.ids.length - r.answered;
        const reviewCount = r.reviewIds.length;
        document.getElementById("screen-done").innerHTML = `
        <header class="app-header"><h1>Kết quả</h1></header>
        <div class="card">
            <p class="small muted" style="text-align:center">${escapeHtml(s.label)}</p>
            <div class="done-score">${r.sure + r.unsure} / ${r.answered}</div>
            <div class="done-sub">câu trả lời đúng${skipped ? ` · ${skipped} câu bỏ qua` : ""}</div>
            <div class="stats-grid" style="margin-bottom:16px">
                ${statHtml(r.sure, "Chắc chắn", "ok")}
                ${statHtml(r.unsure, "Mập mờ", "warn")}
                ${statHtml(r.wrong, "Sai", "bad")}
            </div>
            <div class="stack">
                ${reviewCount ? `<button type="button" class="btn btn-primary" data-action="retry-weak">Ôn lại ${reviewCount} câu sai & mập mờ</button>` : ""}
                <button type="button" class="btn" data-action="restart">Làm lại lượt này</button>
                <button type="button" class="btn" data-action="finish">Về trang chủ</button>
            </div>
        </div>`;
      }

      // ====================
      // Modal & Toast
      // ====================
      function showConfirm({
        title,
        message,
        confirmLabel = "OK",
        danger = false,
        hideCancel = false,
      }) {
        const modal = document.getElementById("modal");
        const okBtn = document.getElementById("modal-ok");
        const cancelBtn = document.getElementById("modal-cancel");
        document.getElementById("modal-title").textContent = title;
        document.getElementById("modal-message").textContent = message;
        okBtn.textContent = confirmLabel;
        okBtn.className = "btn " + (danger ? "btn-danger" : "btn-primary");
        cancelBtn.hidden = hideCancel;
        modal.querySelector(".modal-actions").style.gridTemplateColumns =
          hideCancel ? "1fr" : "";
        modal.hidden = false;
        (hideCancel ? okBtn : cancelBtn).focus();

        return new Promise((resolve) => {
          const close = (result) => {
            modal.hidden = true;
            okBtn.onclick = cancelBtn.onclick = modal.onclick = null;
            document.removeEventListener("keydown", onKey);
            resolve(result);
          };
          const onKey = (e) => {
            if (e.key === "Escape") close(false);
          };
          okBtn.onclick = () => close(true);
          cancelBtn.onclick = () => close(false);
          modal.onclick = (e) => {
            if (e.target === modal) close(false);
          };
          document.addEventListener("keydown", onKey);
        });
      }

      let toastTimer;
      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.hidden = true;
        }, 2500);
      }

      // ====================
      // Event Handlers
      // ====================
      async function handleReset() {
        const ok = await showConfirm({
          title: "Reset Progress",
          message:
            "Bạn có chắc muốn xóa toàn bộ tiến độ?\nHành động này không thể hoàn tác.",
          confirmLabel: "Reset",
          danger: true,
        });
        if (!ok) return;
        state.progress = {};
        state.session = null;
        resetQuestionUi();
        saveState();
        renderHome();
        showToast("Đã xóa toàn bộ tiến độ");
      }

      const actions = {
        start: (el) => startStudy(el.dataset.mode),
        resume: () => {
          resetQuestionUi();
          openQuizScreen();
        },
        reset: () => handleReset(),
        home: () => goHome(),
        favorite: () => {
          const q = currentQuestion();
          if (q) {
            toggleFavorite(q.id);
            renderQuiz();
          }
        },
        choose: (el) =>
          selectChoice(Number(el.dataset.part), Number(el.dataset.index)),
        "toggle-vi": () => {
          viOpen = !viOpen;
          renderQuiz();
        },
        check: () => checkAnswer(),
        rate: (el) => goNext(el.dataset.confidence),
        next: () => goNext(),
        prev: () => goToQuestion(state.session.index - 1),
        "retry-weak": () =>
          startSession(
            getSessionResults().reviewIds,
            "Ôn lại câu sai & mập mờ",
          ),
        restart: () => {
          const s = state.session;
          startSession(s.ids, s.label);
        },
        finish: () => {
          endSession();
          goHome();
        },
      };

      function handleClick(e) {
        const el = e.target.closest("[data-action]");
        if (!el || el.disabled) return;
        const action = actions[el.dataset.action];
        if (action) action(el);
      }

      function handleChange(e) {
        const target = e.target;
        if (target.id === "category-all") {
          toggleAllCategories();
          renderHome();
        } else if (target.dataset.category !== undefined) {
          toggleCategory(target.dataset.category);
          renderHome();
        } else if (target.id === "shuffle-toggle") {
          updateSettings({ shuffle: target.checked });
        }
      }

      // Phím tắt khi dùng máy tính:
      //   1-9 / A-J chọn đáp án (chỉ với câu 1 phần), Enter kiểm tra / câu tiếp,
      //   sau khi đúng: S = chắc chắn, M = mập mờ; ← → chuyển câu; V = bật/tắt tiếng Việt.
      function handleKeydown(e) {
        if (
          document.getElementById("screen-quiz").hidden ||
          !document.getElementById("modal").hidden
        )
          return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const key = e.key.toUpperCase();
        const answer = currentAnswer();
        const q = currentQuestion();
        const singlePart = q && getParts(q).length === 1;
        if (needsRating(answer) && (key === "S" || key === "M")) {
          goNext(key === "M" ? CONFIDENCE.UNSURE : CONFIDENCE.SURE);
        } else if (key === "V" && q && hasVietnamese(q)) {
          actions["toggle-vi"]();
        } else if (singlePart && /^[1-9]$/.test(key))
          selectChoice(0, getChoiceOrder(q, 0)[Number(key) - 1]);
        else if (singlePart && key.length === 1 && LETTERS.includes(key))
          selectChoice(0, getChoiceOrder(q, 0)[LETTERS.indexOf(key)]);
        else if (key === "ENTER") {
          e.preventDefault();
          answer ? goNext() : checkAnswer();
        } else if (key === "ARROWRIGHT" && answer) goNext();
        else if (key === "ARROWLEFT" && state.session.index > 0) actions.prev();
      }

      // ====================
      // Init
      // ====================
      function init() {
        prepareQuestions();
        state = loadState();
        cleanSession();

        // Reload khi đang ở #quiz: tạo lại một mục lịch sử phía sau để nút Back vẫn về trang chủ.
        const base = location.pathname + location.search;
        if (location.hash === "#quiz" && state.session) {
          history.replaceState(null, "", base);
          history.pushState(null, "", base + "#quiz");
        } else if (location.hash) {
          history.replaceState(null, "", base);
        }

        document.addEventListener("click", handleClick);
        document.addEventListener("change", handleChange);
        document.addEventListener("keydown", handleKeydown);
        window.addEventListener("hashchange", () => {
          resetQuestionUi();
          route();
          window.scrollTo(0, 0);
        });

        route();
        registerOfflineSupport();
      }

      // Đăng ký service worker (file sw.js cạnh index.html) để mở được khi offline.
      // Chỉ chạy khi mở qua http(s) như GitHub Pages; mở file trực tiếp (file://) thì bỏ qua.
      function registerOfflineSupport() {
        if (!("serviceWorker" in navigator) || !location.protocol.startsWith("http"))
          return;
        navigator.serviceWorker.register("sw.js").catch((err) => {
          console.warn("Không đăng ký được service worker", err);
        });
      }

      init();
    </script>
  </body>
</html>
